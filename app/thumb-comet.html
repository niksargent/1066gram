<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>1066gram thumbnail (comet)</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <style>
    /* Alternative YouTube thumbnail, 1280x720. Rendered by tools/render-thumb.mjs comet. */
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    #th { position: relative; width: 1280px; height: 720px; overflow: hidden;
      background: radial-gradient(ellipse at 72% 30%, #3b4c86 0%, #1d2547 45%, #0b0e1d 100%); }
    #th svg.art { position: absolute; inset: 0; }
    .head { position: absolute; left: 40px; top: 34px; width: 640px; font: 900 64px/1.02 'Inter', sans-serif; color: #fffaf0; letter-spacing: -1px;
      -webkit-text-stroke: 10px #0b0e1d; paint-order: stroke fill; filter: drop-shadow(0 8px 18px #000a); }
    .head .big { display: block; font-size: 118px; color: #ffd34d; letter-spacing: -3px; margin-top: 4px; }
    .like { position: absolute; left: 820px; top: 300px; display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 18px; border-radius: 40px;
      background: #fffaf0; box-shadow: 0 12px 30px #000a; font: 900 46px/1 'Inter', sans-serif; color: #1b1610; transform: rotate(-4deg); }
    .like svg { width: 50px; height: 50px; }
    .post { position: absolute; left: 900px; top: 404px; display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 12px; border-radius: 22px;
      background: #fffaf0; box-shadow: 0 12px 30px #000a; font: 800 30px/1.1 'Inter', sans-serif; color: #1b1610; transform: rotate(3deg); }
    .post .av { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; }
    .post .av svg { width: 100%; height: 100%; }
    .post b { color: #283149; }
    .tag { position: absolute; right: 26px; top: 24px; display: flex; align-items: center; gap: 14px; padding: 10px 20px 12px; border-radius: 14px;
      background: #0b0e1de6; box-shadow: 0 8px 24px #0007; border: 2px solid #ffd34d44; }
    .tag .logo { font: 44px/1 'Uncial Antiqua', serif; color: #e0482f; }
    .tag .ot { font: 900 26px/1 'Inter', sans-serif; color: #fffaf0; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="th"></div>
  <script type="module">
    import { figure, comet, sh, wob, STYLE, defs, seed } from './js/art.js';
    import { avatar } from './js/scenes.js';
    seed(116);
    const G = 700;
    // Stars, stitched as little crosses.
    let stars = '';
    for (let i = 0; i < 70; i++) {
      const x = (i * 197) % 1280, y = (i * 113) % 470, r = 1.5 + (i % 3);
      stars += `<path d="M${x - r},${y}L${x + r},${y}M${x},${y - r}L${x},${y + r}" stroke="#f3e2b0" stroke-width="2" opacity="${0.35 + (i % 4) * 0.15}"/>`;
    }
    // The crowd, big and close, pointing up at the sky.
    const crowd = [140, 255, 370, 485].map((x, i) => figure({ who: i % 2 ? 'english' : 'harold', helmet: null,
      tunic: ['red', 'green', 'ochre', 'blue'][i], legs: ['blue', 'red', 'green', 'ochre'][i], hair: ['ochre', 'navy', 'red', 'ochre'][i], moustache: true,
      x, y: G + 30, s: 2.15 + (i % 2) * 0.1, armF: 152 + i * 4, still: true })).join('');
    const heart = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.7-9.1C.6 8.4 2.6 4.4 6.4 4.4c2.2 0 3.7 1.2 4.6 2.7.9-1.5 2.4-2.7 4.6-2.7 3.8 0 5.8 4 4.1 7.5C19.5 16.3 12 21 12 21z" fill="#e0245e"/></svg>';
    document.getElementById('th').innerHTML =
      `<svg class="art" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">${STYLE}${defs()}
        ${stars}
        <g transform="translate(1030,175) scale(2.6)">${comet(0, 0, 1)}</g>
        ${sh(wob([[0, 690], [500, 682], [900, 690], [1280, 680], [1280, 720], [0, 720]], { j: 3 }), 'green')}
        ${crowd}
      </svg>
      <div class="head">If the Bayeux Tapestry<span class="big">was Instagram</span></div>
      <div class="like">${heart}4.2B</div>
      <div class="post"><span class="av">${avatar('comet')}</span><span><b>@HalleysComet</b> hi</span></div>
      <div class="tag"><span class="logo">1066gram</span><span class="ot">TRAILER</span></div>`;
    window.__ready = document.fonts.ready.then(() => true);
  </script>
</body>
</html>
