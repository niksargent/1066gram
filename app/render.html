<!doctype html>

  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
  <style>
    /* A 1080x1920 TikTok frame. Rendered frame by frame by tools/render-video.mjs. */
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #eadfc4; }
    *, *::before, *::after { transition: none !important; }
    .v { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #23211b; font-family: var(--ui);
      background: repeating-linear-gradient(0deg, #0000 0 5px, #d9caa766 5px 6px), repeating-linear-gradient(90deg, #0000 0 5px, #fff3 5px 6px), #eadfc4; }
    .band { position: absolute; left: 0; width: 1080px; height: 124px; }
    .band.top { top: 0; } .band.bottom { bottom: 0; }
    .hook { position: absolute; left: 70px; right: 70px; top: 158px; font: 900 60px/1.1 var(--ui); color: #283149; text-wrap: balance; letter-spacing: -.5px; }
    .hook em { font-style: normal; color: #b4513a; }
    .head { position: absolute; left: 90px; top: 398px; display: flex; align-items: center; gap: 18px; }
    .head .av { width: 76px; height: 76px; padding: 4px; border-radius: 50%; background: linear-gradient(135deg, #d3a24a, #b4513a); }
    .head .av svg { border: 3px solid #fbf6ea; }
    .head b { font: 800 36px/1.1 var(--ui); }
    .head .crown { width: 30px; height: 24px; margin-left: 8px; }
    .head small { display: block; font: 500 28px/1.2 var(--ui); color: #7a7260; }
    .vstage { position: absolute; left: 90px; top: 500px; width: 400px; height: 500px; transform: scale(2.25); transform-origin: 0 0; box-shadow: 0 2px 6px #0003; }
    .vstage .media { width: 400px; height: 500px; aspect-ratio: auto; }
    .cm-stack { position: absolute; left: 70px; right: 150px; top: 1080px; display: flex; flex-direction: column; gap: 18px; }
    .bubble { display: flex; gap: 16px; align-items: flex-start; padding: 18px 22px; border-radius: 26px; background: #fffaf0; box-shadow: 0 10px 30px #0003; opacity: 0; }
    .bubble .av { width: 60px; height: 60px; }
    .bubble p { margin: 0; font: 500 34px/1.25 var(--ui); }
    .bubble b { display: block; font: 800 28px/1.2 var(--ui); color: #283149; margin-bottom: 4px; }
    .end { position: absolute; inset: 124px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; opacity: 0;
      background: repeating-linear-gradient(0deg, #0000 0 5px, #d9caa766 5px 6px), #eadfc4; }
    .end .logo { font: 170px/1 var(--logo); color: #b4513a; }

    .end .cast { display: flex; gap: 14px; }
    .end .cast .av { width: 110px; height: 110px; box-shadow: 0 0 0 4px #eadfc4, 0 0 0 8px #d3a24a; }
    .mark { position: absolute; bottom: 132px; right: 160px; font: 40px/1 var(--logo); color: #b4513a; opacity: .85; }
  </style>
